<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="BIO 165 logo">
  <!-- Rod-shaped bacterium containing a binomial (coin-toss) distribution -->
  <rect x="3" y="14" width="58" height="36" rx="18" fill="#2a9d8f"/>
  <rect x="6.5" y="17.5" width="51" height="29" rx="14.5" fill="#1a3a4a"/>
  <g fill="#f2b134">
    <rect x="15" y="38" width="5" height="4" rx="1"/>
    <rect x="22" y="31" width="5" height="11" rx="1"/>
    <rect x="29.5" y="24" width="5" height="18" rx="1"/>
    <rect x="37" y="31" width="5" height="11" rx="1"/>
    <rect x="44" y="38" width="5" height="4" rx="1"/>
  </g>
  <!-- coin -->
  <circle cx="52" cy="13" r="10" fill="#f2b134" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="52" cy="13" r="6.2" fill="none" stroke="#c98a12" stroke-width="1.4"/>
</svg>
