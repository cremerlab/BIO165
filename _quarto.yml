project:
  type: book
  output-dir: _book

# Two builds (see README): the default "web" profile builds the website,
# including the dry labs (_quarto-web.yml); the "pdf" profile builds the
# PDF of the lecture script only (_quarto-pdf.yml).
profile:
  default: web

book:
  title: "Quantitative Approaches in Modern Biology"
  subtitle: "BIO 165/265 — Lecture Script"
  author:
    - "Shaili Mathur"
    - "Jonas Cremer"
  date: last-modified
  site-url: "https://cremerlab.github.io/BIO165"
  repo-url: "https://github.com/cremerlab/BIO165"
  output-file: "BIO165-lecture-script"   # name of the downloadable PDF
  search:
    location: navbar
    type: overlay
  page-navigation: true
  favicon: images/logo.svg

  navbar:
    logo: images/logo.svg
    title: "BIO 165 · Quantitative Biology"
    left:
      - text: "Lecture script"
        href: chapters/1a-introduction.qmd
      - text: "PDF"
        icon: file-earmark-pdf
        href: BIO165-lecture-script.pdf

  sidebar:
    style: floating
    collapse-level: 1

  chapters:
    - index.qmd
    # BEGIN CHAPTERS (generated by old_script/convert/convert.py)
    - part: "Week 1: Introduction and getting started"
      chapters:
        - chapters/1a-introduction.qmd
        - chapters/1b-getting-python-notebooks.qmd
        - chapters/1c-biological-data-types.qmd
    - part: "Week 2: Biological data"
      chapters:
        - chapters/2a-biological-data-origin.qmd
        - chapters/2b-data-visualization.qmd
        - chapters/2c-datasets-this-course.qmd
    - part: "Week 3: Fitting and regression"
      chapters:
        - chapters/3a-fitting-importance-regression.qmd
        - chapters/3b-linear-regression.qmd
        - chapters/3c-non-linear-regression.qmd
    - part: "Week 4: Probability and uncertainty"
      chapters:
        - chapters/4a-probabilistic-view-law.qmd
        - chapters/4b-sampling-variability-standard.qmd
        - chapters/4c-bootstrapping.qmd
    - part: "Week 5: Hypothesis testing"
      chapters:
        - chapters/5a-hypothesis-testing.qmd
        - chapters/5b-multiple-hypothesis-testing.qmd
    - part: "Week 6: Counting statistics"
      chapters:
        - chapters/6a-counting-statistics-discrete.qmd
    - part: "Week 7: Omics and high-dimensional data"
      chapters:
        - chapters/7a-omics-data-counting.qmd
        - chapters/7b-nonlinear-dimensionality-reduction.qmd
        - chapters/7c-clustering-algorithms.qmd
    - part: "Week 8: Dynamical systems and stochastic processes (optional)"
      chapters:
        - chapters/8a-differential-equation-modeling.qmd
        - chapters/8b-dynamical-relation-between.qmd
        - chapters/8c-stochastic-processes.qmd
    - part: "Week 9: Nonlinear dynamics (optional)"
      chapters:
        - chapters/9a-nonlinear-dynamics.qmd
    # END CHAPTERS
    - references.qmd

  page-footer:
    left: "BIO 165/265 · Stanford University · [Cremer Lab](https://cremerlab.github.io)"
    right:
      - icon: github
        href: https://github.com/cremerlab/BIO165

bibliography: references.bib

crossref:
  chapters: true   # number equations/figures per chapter (Eq. 2.3, Fig. 4.1)

format:
  html:
    theme:
      - flatly
      - styles.scss
    toc: true
    toc-depth: 2
    toc-expand: true
    toc-title: "On this page"
    number-sections: true
    html-math-method: mathjax
    lightbox: true
    link-external-newwindow: true
    reference-location: margin
    citation-location: margin
